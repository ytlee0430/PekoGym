name: ironmon
description: IronMon — Gym Training as Pokémon Battle
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  meta: ^1.15.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.2.5

dev_dependencies:
  build_runner: ^2.10.5
  drift_dev: ^2.31.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/bosses/
    - assets/images/moves/
    - assets/images/types/
    - assets/images/ui/
    - assets/audio/sfx/
    - assets/audio/bgm/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
